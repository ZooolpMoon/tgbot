name = "tgbot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# GitHub 模板配置：请勿填入真实密钥。
# 生产/本地部署请使用：npx wrangler deploy -c wrangler.production.toml
[vars]
BOT_TOKEN = ""
BOT_USERNAME = "Zooolp_bot"
MY_TELEGRAM_ID = ""
WEBHOOK_SECRET = ""
APP_TIMEZONE = "Asia/Shanghai"
BOT_OWNER_NAME = "管理员"
BOT_OWNER_USERNAME = "Zooolp_admin"

# D1 数据库：创建后取消注释并填入 database_id
# [[d1_databases]]
# binding = "DB"
# database_name = "tgbot-db"
# database_id = ""

[ai]
binding = "AI"
